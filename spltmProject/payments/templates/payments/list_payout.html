{% extends "adminDashBoard.html" %}
{% block content %}

<link rel="stylesheet" href="/static/assets/css/pagination.css" />

<style>
  .filter-card {
    border-radius: 14px;
    border: 1px solid #eef2f7;
  }

  .tx-row {
    border: 1px solid #eef2f7;
    border-radius: 14px;
    padding: 14px 18px;
    background: #fff;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .tx-row:hover {
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.06);
    transform: translateY(-2px);
  }

  .tx-title {
    font-weight: 600;
    font-size: 15px;
  }

  .tx-meta {
    font-size: 13px;
    color: #6b7280;
  }

  .badge-type {
    background: #eef2ff;
    color: #4f46e5;
  }

  .btn-primary {
    background-color: #94d600 !important;
    border-color: #94d600 !important;
  }
  
  .refresh-btn {
    width: 36px;
    height: 36px;
    border-radius: 18px;
    border: none;
    background: #f3f4f6;
    color: #475569;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  
  .refresh-btn:hover {
    background: #e6eef8;
  }

  .txn-id-display {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #1f2937;
    background: #f3f4f6;
    padding: 4px 8px;
    border-radius: 4px;
    word-break: break-all;
    margin-top: 4px;
    user-select: all;
    cursor: pointer;
  }

  .txn-id-display:hover {
    background: #e5e7eb;
  }

  .txn-id-label {
    font-weight: 600;
    font-size: 12px;
    color: #374151;
    margin-bottom: 4px;
  }
</style>

<div class="container-fluid mt-4">
  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">Vendor Payouts</h3>
  </div>

  <!-- FILTER BAR -->
  <div class="card filter-card mb-4 shadow-sm">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Search</label>
          <input
            type="text"
            id="filter-search"
            class="form-control"
            placeholder="Vendor, UPI or purpose"
          />
        </div>

        <div class="col-md-2">
          <label class="form-label">Status</label>
          <select id="filter-status" class="form-select">
            <option value="">All</option>
            <option value="initiated">Initiated</option>
            <option value="processing">Processing</option>
            <option value="processed">Processed</option>
            <option value="failed">Failed</option>
          </select>
        </div>

        <div class="col-md-2 d-grid">
          <button id="apply-filter" class="btn btn-primary">
            <i class="ti ti-filter"></i> Apply
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- PAYOUT LIST -->
  <div id="transactions-container">
    <div id="transactions-list" class="d-grid gap-3"></div>

    <div class="pagination-wrapper">
      <div class="pagination-pill">
        <div id="transactions-pagination" class="d-flex"></div>
        <div class="pg-info" id="pagination-info"></div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="/static/assets/js/customJs/util.js"></script>

<script>
  let currentPage = 1;
  const pageSize = 10;

  async function loadPayouts() {
    const params = {
      pageNo: currentPage,
      pageSize,
      status: document.getElementById("filter-status")?.value || "",
      search: document.getElementById("filter-search")?.value || "",
    };

    try {
      const qs = new URLSearchParams(params).toString();
      const url = `/api/payments/vendor/?${qs}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const resp = await response.json();
      const items = resp.Data || [];
      const totalPages = resp.TotalPages || 1;
      const totalRecords = resp.TotalRecord || 0;

      renderPayoutList(items);
      displayPaginationInfo(
        "pagination-info",
        currentPage,
        totalPages,
        totalRecords
      );

      renderPagination(
        "transactions-pagination",
        currentPage,
        totalPages,
        (page) => {
          currentPage = page;
          loadPayouts();
        }
      );
    } catch (err) {
      console.error(err);
    }
  }

  function renderPayoutList(payouts) {
    const list = document.getElementById("transactions-list");
    list.innerHTML = "";

    if (!payouts.length) {
      list.innerHTML = `
        <div class="tx-row">
          <div class="text-muted text-center">No payouts found</div>
        </div>`;
      return;
    }

    payouts.forEach((p) => {
      const row = document.createElement("div");
      row.className = "tx-row";
      row.innerHTML = `
        <div class="row align-items-center">
          <div class="col-md-3">
            <div class="tx-title">${p.vendor_name}</div>
            <div class="tx-meta">UPI: ${p.vendor_upi}</div>
          </div>

          <div class="col-md-3">
            <div class="tx-meta">${p.purpose}</div>
            <div class="tx-meta">📅 ${convertUtcToIndianTime(p.created_at)}</div>
          </div>

          <div class="col-md-1">
            <span class="badge badge-type">${p.status_display || p.status}</span>
          </div>

          <div class="col-md-1 fw-semibold">
            ₹ ${p.amount}
          </div>

          <div class="col-md-2">
            ${p.razorpay_payout_id ? `
              <div class="txn-id-label">
                🔗 Transaction ID
              </div>
              <div class="txn-id-display" title="Click to select all">
                ${p.razorpay_payout_id}
              </div>
            ` : `
              <div class="tx-meta text-muted">⏳ Pending</div>
            `}
          </div>

          <div class="col-md-1 text-center">
             <button type="button" class="btn btn-sm btn-light refresh-btn" data-id="${p.id}" title="Refresh status">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M21 12a9 9 0 10-3.22 6.44" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 3v6h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <div class="col-md-3 text-end text-muted d-flex justify-content-end align-items-center">
           
          </div>
        </div>
      `;
      list.appendChild(row);
      // Attach click handler for the refresh button
      const btn = row.querySelector('.refresh-btn');
      if (btn) {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const txId = btn.getAttribute('data-id');
          await refreshPayoutStatus(txId, btn);
        });
      }
    });
  }

  async function refreshPayoutStatus(transactionId, btn) {
    if (!transactionId) return;
    const origHtml = btn.innerHTML;
    try {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';

      const url = `/api/payments/vendor/${transactionId}/refresh-status/`;
      const resp = await fetch(url, { method: 'POST' });
      if (!resp.ok) {
        console.error('Refresh failed', resp.status);
      }
    } catch (err) {
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerHTML = origHtml;
      // Reload list after refresh
      loadPayouts();
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    loadPayouts();

    document.getElementById("apply-filter").addEventListener("click", () => {
      currentPage = 1;
      loadPayouts();
    });
  });
</script>
{% endblock %}
